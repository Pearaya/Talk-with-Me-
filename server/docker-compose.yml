services:
  postgres:
    image: postgres:16-alpine
    container_name: coaching-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: coaching
      POSTGRES_DB: coaching
    ports:
      - "5432:5432"
    volumes:
      - coaching_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching -d coaching"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coaching_pg:
